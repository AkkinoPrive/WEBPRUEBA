<script>

/* =========================================================
   CONFIGURACION
   ========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbwVZWvj17WYo6amUDwZE7HG09dkkDSw9Zo0M0e6dfJ22TC7WHaDTtc1BnTa1XoTxmX0/exec";

const WHATSAPP =
"5493476552435";

const MINIMO_MAYORISTA =
5;

const PRODUCTOS_POR_PAGINA =
30;


/* =========================================================
   VARIABLES
   ========================================================= */

let perfumes = [];

let carrito = [];

let modoActual =
"particular";

let paginaActual =
1;

let productosFiltrados =
[];

let tipoActual =
"TODOS";

let filtroExtraActual =
"TODOS";

let formaPagoActual =
"EFECTIVO / TRANSFERENCIA";


/* =========================================================
   UTILIDADES
   ========================================================= */

function numero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){
        return 0;
    }

    if(
        typeof valor ===
        "number"
    ){
        return valor;
    }

    let texto =
        String(valor)
        .trim()
        .replace(/ARS/gi,"")
        .replace(/\$/g,"")
        .replace(/\s/g,"");

    if(
        texto.includes(".") &&
        texto.includes(",")
    ){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }

    else if(
        texto.includes(",")
    ){

        texto =
            texto.replace(",",".");
    }

    const resultado =
        Number(texto);

    return isNaN(resultado)
        ? 0
        : resultado;
}


function dinero(valor){

    const numeroValor =
        numero(valor);

    return numeroValor.toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            maximumFractionDigits:0
        }
    );
}


function texto(valor){

    if(
        valor === null ||
        valor === undefined
    ){
        return "";
    }

    return String(valor).trim();
}


function normalizar(valor){

    return texto(valor)
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toUpperCase()
        .trim();
}


function escapeHTML(text){

    return texto(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeJS(text){

    return texto(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        );
}


/* =========================================================
   ESTADO
   ========================================================= */

function obtenerEstado(producto){

    const estado =
        normalizar(
            producto.estado
        );

    if(!estado){
        return "DISPONIBLE";
    }

    if(
        estado.includes("SIN STOCK") ||
        estado.includes("AGOTADO")
    ){
        return "SIN STOCK";
    }

    if(
        estado.includes("PEDIDO") ||
        estado.includes("RESERVA")
    ){
        return "A PEDIDO";
    }

    if(
        estado.includes("DISPONIBLE") ||
        estado.includes("STOCK")
    ){
        return "DISPONIBLE";
    }

    return estado;
}


function estadoTexto(producto){

    const estado =
        obtenerEstado(producto);

    return estado ||
        "DISPONIBLE";
}


function stockClase(producto){

    const estado =
        obtenerEstado(producto);

    if(
        estado ===
        "SIN STOCK"
    ){
        return "sin-stock";
    }

    if(
        estado ===
        "A PEDIDO"
    ){
        return "pedido";
    }

    return "disponible";
}


/* =========================================================
   PRECIOS ORIGINALES
   ========================================================= */

function precioOriginal(producto){

    const lista =
        numero(
            producto.precioLista
        );

    const descuento =
        numero(
            producto.descuento
        );

    const tipo =
        normalizar(
            producto.tipoDescuento
        );

    if(
        lista <= 0
    ){
        return {
            lista:0,
            descuento:0,
            final:0
        };
    }

    let final =
        lista;

    if(
        descuento > 0
    ){

        if(
            tipo.includes("%") ||
            tipo.includes("PORCENTAJE") ||
            tipo.includes("PORCENTUAL")
        ){

            final =
                lista -
                (
                    lista *
                    descuento /
                    100
                );
        }

        else if(
            tipo.includes("$") ||
            tipo.includes("PESO") ||
            tipo.includes("FIJO") ||
            tipo.includes("MONTO")
        ){

            final =
                lista -
                descuento;
        }

        else{

            /*
            Si hay descuento pero no se
            especificó el tipo, asumimos
            porcentaje.
            */

            if(
                descuento > 0 &&
                descuento < 100
            ){

                final =
                    lista -
                    (
                        lista *
                        descuento /
                        100
                    );
            }

            else{

                final =
                    lista -
                    descuento;
            }
        }
    }

    if(final < 0){
        final = 0;
    }

    return {
        lista:lista,
        descuento:descuento,
        final:final
    };
}



function precioParticularProducto(producto){

    const precioParticular =
        numero(
            producto.precioParticular
        );

    if(precioParticular > 0){
        return precioParticular;
    }

    return numero(
        producto.valorReal
    );
}


function descuentoTexto(producto){

    const descuento =
        numero(
            producto.descuento
        );

    const tipo =
        texto(
            producto.tipoDescuento
        );

    if(
        descuento <= 0
    ){
        return "";
    }

    if(
        tipo
    ){
        return `${dinero(descuento)} ${escapeHTML(tipo)}`;
    }

    return `${descuento}% OFF`;
}


function formaPagoProducto(producto){

    const forma =
        normalizar(
            producto.formaPago
        );

    if(!forma){
        return "";
    }

    return forma;
}


/* =========================================================
   CARGAR API - JSONP
   =========================================================
   Apps Script responde como:
   callback([...])

   No usamos fetch() porque la API está en otro dominio
   y JSONP evita el problema de CORS.
   ========================================================= */

function cargarPerfumes(){

    const callbackName =
        "__akkinoJSONP_" +
        Date.now();

    const script =
        document.createElement("script");

    let finalizado = false;


    function limpiar(){

        try{
            delete window[callbackName];
        }
        catch(error){
            window[callbackName] =
                undefined;
        }

        if(script.parentNode){
            script.parentNode.removeChild(script);
        }
    }


    function mostrarError(error){

        console.error(
            "Error cargando perfumes:",
            error
        );

        document
        .getElementById(
            "productos"
        )
        .innerHTML = `

            <div
            class="mensaje-vacio">

                No se pudieron cargar
                los perfumes.

                <br><br>

                <small>
                    ${escapeHTML(
                        error &&
                        error.message
                        ?
                        error.message
                        :
                        "Error de conexión con la API."
                    )}
                </small>

            </div>

        `;
    }


    window[callbackName] =
        function(data){

            if(finalizado){
                return;
            }

            finalizado = true;

            limpiar();


            if(
                !Array.isArray(data)
            ){

                const mensaje =
                    data &&
                    data.error
                    ?
                    data.error
                    :
                    "Respuesta inválida de la API.";

                mostrarError(
                    new Error(
                        mensaje
                    )
                );

                return;
            }


            perfumes =
                data;


            crearCategorias();

            aplicarFiltros();

        };


    script.onerror =
        function(){

            if(finalizado){
                return;
            }

            finalizado = true;

            limpiar();

            mostrarError(
                new Error(
                    "No se pudo conectar con la API de AKKINO."
                )
            );

        };


    const separador =
        API.includes("?")
        ? "&"
        : "?";


    script.src =
        API +
        separador +
        "callback=" +
        encodeURIComponent(
            callbackName
        ) +
        "&_=" +
        Date.now();


    script.async = true;

    document
    .head
    .appendChild(
        script
    );
}

/* =========================================================
   CATEGORÍA / TIPO PRINCIPAL
   =========================================================
   La categoría principal NO se pierde cuando aplicamos
   filtros secundarios como STOCK, NUEVOS INGRESOS o
   SIN STOCK.
   ========================================================= */

function tipoPrincipalProducto(producto){

    const tipo =
        normalizar(
            producto.tipo
        );


    if(
        tipo.includes(
            "ORIGINAL"
        )
    ){

        return "ORIGINALES";
    }


    if(
        tipo.includes(
            "INSPIRACION"
        )
    ){

        return "INSPIRACIONES 60ML";
    }


    return tipo;
}


function categoriaCoincide(
    producto,
    categoriaBuscada
){

    const buscada =
        normalizar(
            categoriaBuscada
        );

    const valor =
        normalizar(
            producto.categoria
        );


    if(!buscada){
        return true;
    }


    /*
    Permite:
    MASCULINOS
    FEMENINOS
    UNISEX

    y también valores múltiples como:
    MASCULINOS, UNISEX
    MASCULINOS / UNISEX
    */

    const categorias =
        valor
        .split(
            /[,;|/]+/
        )
        .map(
            x => normalizar(x)
        )
        .filter(Boolean);


    return categorias.some(
        categoria =>
            categoria ===
            buscada
    );
}


function nuevoIngresoProducto(
    producto
){

    const valor =
        normalizar(
            producto.nuevoIngreso
        );


    return (
        valor === "SI" ||
        valor === "SÍ" ||
        valor === "TRUE" ||
        valor === "1" ||
        valor === "NUEVO" ||
        valor === "NUEVOS INGRESOS"
    );
}



/* =========================================================
   APLICAR FILTROS
   ========================================================= */

function aplicarFiltros(){

    const textoBusqueda =
        normalizar(
            document
            .getElementById(
                "buscar"
            )
            .value
        );


    productosFiltrados =
        perfumes.filter(
            producto => {

                const nombre =
                    normalizar(
                        producto.perfume
                    );

                const categoria =
                    normalizar(
                        producto.categoria
                    );

                const tipo =
                    tipoPrincipalProducto(
                        producto
                    );

                const nuevoIngreso =
                    normalizar(
                        producto.nuevoIngreso
                    );

                const estado =
                    obtenerEstado(
                        producto
                    );


                /*
                ---------------------------------------------
                BUSQUEDA
                ---------------------------------------------
                */

                const coincideBusqueda =
                    !textoBusqueda ||
                    nombre.includes(
                        textoBusqueda
                    ) ||
                    categoria.includes(
                        textoBusqueda
                    ) ||
                    tipo.includes(
                        textoBusqueda
                    );


                if(
                    !coincideBusqueda
                ){
                    return false;
                }


                /*
                ---------------------------------------------
                TIPO PRINCIPAL
                ---------------------------------------------
                */

                let coincideTipo =
                    true;

                if(
                    tipoActual !==
                    "TODOS"
                ){

                    coincideTipo =
                        tipo ===
                        normalizar(
                            tipoActual
                        );
                }


                if(
                    !coincideTipo
                ){
                    return false;
                }


                /*
                ---------------------------------------------
                FILTRO EXTRA
                ---------------------------------------------
                */

                let coincideExtra =
                    true;


                switch(
                    filtroExtraActual
                ){

                    case "MASCULINOS":

                        coincideExtra =
                            categoriaCoincide(
                                producto,
                                "MASCULINOS"
                            );

                        break;


                    case "FEMENINOS":

                        coincideExtra =
                            categoriaCoincide(
                                producto,
                                "FEMENINOS"
                            );

                        break;


                    case "UNISEX":

                        coincideExtra =
                            categoriaCoincide(
                                producto,
                                "UNISEX"
                            );

                        break;


                    case "STOCK INSPIRACIONES":

                        coincideExtra =
                            tipo ===
                            "INSPIRACIONES 60ML" &&
                            estado ===
                            "DISPONIBLE";

                        break;


                    case "NUEVOS INGRESOS":

                        coincideExtra =
                            nuevoIngresoProducto(
                                producto
                            );

                        break;


                    case "SIN STOCK":

                        coincideExtra =
                            estado ===
                            "SIN STOCK";

                        break;


                    case "DISPONIBLES":

                        coincideExtra =
                            estado ===
                            "DISPONIBLE";

                        break;


                    case "A PEDIDO":

                        coincideExtra =
                            estado ===
                            "A PEDIDO";

                        break;


                    default:

                        coincideExtra =
                            true;

                        break;

                }


                return coincideExtra;

            }
        );


    mostrarPagina();
}

/* =========================================================
   MAYORISTA
   ========================================================= */

function totalUnidades(){

    return carrito.reduce(
        (
            total,
            item
        ) => {

            return total +
                item.cantidad;

        },
        0
    );
}


function obtenerCantidad(
    perfume
){

    const item =
        carrito.find(
            x =>
                x.producto.perfume ===
                perfume
        );

    return item
        ? item.cantidad
        : 0;
}


function precioMayorista(
    producto,
    cantidad
){

    const escalas = [
        {
            min:100,
            precio:
                numero(
                    producto.precio100
                )
        },
        {
            min:50,
            precio:
                numero(
                    producto.precio50
                )
        },
        {
            min:30,
            precio:
                numero(
                    producto.precio30
                )
        },
        {
            min:20,
            precio:
                numero(
                    producto.precio20
                )
        },
        {
            min:10,
            precio:
                numero(
                    producto.precio10
                )
        },
        {
            min:5,
            precio:
                numero(
                    producto.precio5
                )
        }
    ];


    for(
        const escala
        of escalas
    ){

        if(
            cantidad >=
            escala.min &&
            escala.precio > 0
        ){

            return escala.precio;
        }
    }


    return numero(
        producto.precio5
    );
}


function escalaMayorista(
    total
){

    if(total >= 100)
        return "100+ unidades";

    if(total >= 50)
        return "50 unidades";

    if(total >= 30)
        return "30 unidades";

    if(total >= 20)
        return "20 unidades";

    if(total >= 10)
        return "10 unidades";

    if(total >= 5)
        return "5 unidades";

    return "Menos de 5 unidades";
}


function proximaEscala(
    total
){

    const escalas = [
        5,
        10,
        20,
        30,
        50,
        100
    ];

    for(
        const escala
        of escalas
    ){

        if(
            total < escala
        ){

            return escala;
        }
    }

    return null;
}


/* =========================================================
   PROMOCIONES PARTICULAR
   ========================================================= */

function calcularCarritoParticular(){

    let precioNormal = 0;

    const grupos = {};


    carrito.forEach(
        item => {

            const producto =
                item.producto;

            const unitario =
                precioParticularProducto(
                    producto
                );

            const promo2 =
                numero(
                    producto.promo2
                );

            const promo3 =
                numero(
                    producto.promo3
                );


            precioNormal +=
                unitario *
                item.cantidad;


            const clave =
                producto.perfume;


            if(!grupos[clave]){

                grupos[clave] = {
                    producto:
                        producto,

                    unidades:0
                };
            }


            grupos[clave].unidades +=
                item.cantidad;

        }
    );


    let totalFinal =
        0;

    const detallePromos =
        [];


    Object
    .values(grupos)
    .forEach(
        grupo => {

            const producto =
                grupo.producto;

            const unidades =
                grupo.unidades;

            const unitario =
                precioParticularProducto(
                    producto
                );

            const promo2 =
                numero(
                    producto.promo2
                );

            const promo3 =
                numero(
                    producto.promo3
                );


            const cantidad =
                unidades;


            const totalNormalGrupo =
                unitario *
                cantidad;


            let mejorTotal =
                totalNormalGrupo;


            let mejorPromo2 =
                0;


            let mejorPromo3 =
                0;


            /*
            3 unidades
            */

            if(
                cantidad >= 3 &&
                promo3 > 0
            ){

                const grupos3 =
                    Math.floor(
                        cantidad / 3
                    );

                const resto3 =
                    cantidad % 3;

                const total3 =
                    grupos3 *
                    promo3 +
                    resto3 *
                    unitario;


                if(
                    total3 <
                    mejorTotal
                ){

                    mejorTotal =
                        total3;

                    mejorPromo3 =
                        grupos3;
                }
            }


            /*
            2 unidades
            */

            if(
                cantidad >= 2 &&
                promo2 > 0
            ){

                const grupos2 =
                    Math.floor(
                        cantidad / 2
                    );

                const resto2 =
                    cantidad % 2;

                const total2 =
                    grupos2 *
                    promo2 +
                    resto2 *
                    unitario;


                if(
                    total2 <
                    mejorTotal
                ){

                    mejorTotal =
                        total2;

                    mejorPromo2 =
                        grupos2;
                }
            }


            totalFinal +=
                mejorTotal;


            if(
                mejorPromo3 > 0
            ){

                detallePromos.push(
                    `${producto.perfume}: ${mejorPromo3} promo 3 unidades`
                );

            }

            else if(
                mejorPromo2 > 0
            ){

                detallePromos.push(
                    `${producto.perfume}: ${mejorPromo2} promo 2 unidades`
                );

            }

        }
    );


    return {
        precioNormal:
            precioNormal,

        totalFinal:
            totalFinal,

        ahorro:
            Math.max(
                0,
                precioNormal -
                totalFinal
            ),

        detallePromos:
            detallePromos
    };
}

        document.getElementById(
            "paginacion"

        Math.ceil(
            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA
        );


    if(
        paginas <= 1
    ){

        cont.innerHTML =
            "";

        return;
    }


    let html =
        "";


    for(
        let i = 1;
        i <= paginas;
        i++
    ){

        html += `

            <button
            class="pagina-btn ${
                i === paginaActual
                ? "activa"
                : ""
            }"
            onclick="
            cambiarPagina(
                ${i}
            )">

                ${i}

            </button>

        `;
    }


    cont.innerHTML =
        html;
}


function cambiarPagina(
    pagina
){

    if(
        pagina < 1 ||
        pagina >
        Math.ceil(
            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA
        )
    ){

        return;
    }


    paginaActual =
        pagina;

    mostrarPagina();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   BUSCADOR
   ========================================================= */

document
.getElementById(
    "buscar"
)
.addEventListener(
    "input",
    function(){

        paginaActual =
            1;

        aplicarFiltros();

    }
);


/* =========================================================
   AGREGAR PRODUCTO
   ========================================================= */

function agregarProducto(
    perfume
){

    const producto =
        perfumes.find(
            p =>
                p.perfume ===
                perfume
        );


    if(!producto){
        return;
    }


    /*
    Los productos sin stock
    no se agregan.
    */

    if(
        obtenerEstado(
            producto
        ) ===
        "SIN STOCK"
    ){

        alert(
            "Este perfume está sin stock."
        );

        return;
    }


    const existente =
        carrito.find(
            item =>
                item.producto.perfume ===
                perfume
        );


    if(existente){

        existente.cantidad++;

    }

    else{

        carrito.push({

            producto:
                producto,

            cantidad:1

        });

    }


    actualizarCarrito();

}


/* =========================================================
   ACTUALIZAR CARRITO
   ========================================================= */

function actualizarCarrito(){

    const total =
        totalUnidades();


    document
    .getElementById(
        "carritoInfo"
    )
    .textContent =
        `${total} ${
            total === 1
            ? "producto"
            : "productos"
        }`;


    /*
    Si mayorista y no llega
    al mínimo, avisamos.
    */

    if(
        modoActual ===
        "mayorista" &&
        total > 0 &&
        total <
        MINIMO_MAYORISTA
    ){

        document
        .getElementById(
            "carritoInfo"
        )
        .textContent =
            `${total} productos · mínimo mayorista ${MINIMO_MAYORISTA}`;

    }

}


/* =========================================================
   ABRIR CARRITO
   ========================================================= */

function abrirCarrito(){

    if(
        !carrito.length
    ){

        alert(
            "Todavía no agregaste productos al pedido."
        );

        return;
    }


    renderizarCarrito();


    document
    .getElementById(
        "modalCarrito"
    )
    .classList.add(
        "activo"
    );
}


/* =========================================================
   CERRAR CARRITO
   ========================================================= */

function cerrarCarrito(){

    document
    .getElementById(
        "modalCarrito"
    )
    .classList.remove(
        "activo"
    );
}


/* =========================================================
   RENDER CARRITO
   ========================================================= */

function renderizarCarrito(){

    const cont =
        document.getElementById(
            "listaCarrito"
        );


    cont.innerHTML =
        carrito
        .map(
            item => {

                const producto =
                    item.producto;

                const precio =
                    modoActual ===
                    "mayorista"

                    ?

                    precioMayorista(
                        producto,
                        Math.max(
                            totalUnidades(),
                            MINIMO_MAYORISTA
                        )
                    )

                    :

                    precioParticularProducto(
                        producto
                    );


                const imagen =
                    texto(
                        producto.foto
                    );


                return `

                    <div
                    class="item-carrito">

                        ${
                            imagen
                            ?
                            `
                            <img
                            src="${escapeHTML(
                                imagen
                            )}"
                            alt=""
                            >
                            `
                            :
                            `
                            <div
                            style="
                            width:65px;
                            height:65px;
                            background:#f4f4f4;
                            border-radius:8px;
                            ">
                            </div>
                            `
                        }


                        <div>

                            <div
                            class="item-carrito-nombre">

                                ${escapeHTML(
                                    producto.perfume
                                )}

                            </div>


                            <div
                            class="item-carrito-precio">

                                ${dinero(
                                    precio
                                )}
                                c/u

                            </div>

                        </div>


                        <div
                        class="cantidad-controles">

                            <button
                            class="cantidad-btn"
                            onclick="
                            modificarCantidad(
                                '${escapeJS(
                                    producto.perfume
                                )}',
                                -1
                            )">

                                −

                            </button>


                            <strong>

                                ${item.cantidad}

                            </strong>


                            <button
                            class="cantidad-btn"
                            onclick="
                            modificarCantidad(
                                '${escapeJS(
                                    producto.perfume
                                )}',
                                1
                            )">

                                +

                            </button>

                        </div>

                    </div>

                `;

            }
        )
        .join("");


    actualizarResumenCarrito();
}


/* =========================================================
   MODIFICAR CANTIDAD
   ========================================================= */

function modificarCantidad(
    perfume,
    cambio
){

    const item =
        carrito.find(
            x =>
                x.producto.perfume ===
                perfume
        );


    if(!item){
        return;
    }


    item.cantidad +=
        cambio;


    if(
        item.cantidad <= 0
    ){

        carrito =
            carrito.filter(
                x =>
                    x.producto.perfume !==
                    perfume
            );

    }


    actualizarCarrito();


    if(
        carrito.length
    ){

        renderizarCarrito();

    }

    else{

        cerrarCarrito();

    }
}


/* =========================================================
   FORMA DE PAGO
   ========================================================= */

function cambiarFormaPago(
    forma
){

    formaPagoActual =
        forma;

    actualizarResumenCarrito();
}


/* =========================================================
   RESUMEN CARRITO
   ========================================================= */

function actualizarResumenCarrito(){

    const cont =
        document.getElementById(
            "resumenCarrito"
        );


    if(
        !carrito.length
    ){

        cont.innerHTML =
            "";

        return;
    }


    if(
        modoActual ===
        "mayorista"
    ){

        const total =
            totalUnidades();


        if(
            total <
            MINIMO_MAYORISTA
        ){

            cont.innerHTML = `

                <div
                class="resumen-linea">

                    <span>
                        Unidades
                    </span>

                    <strong>
                        ${total}
                    </strong>

                </div>


                <div
                style="
                margin-top:10px;
                color:#b00000;
                font-size:12px;
                ">

                    El pedido mayorista
                    requiere mínimo
                    ${MINIMO_MAYORISTA}
                    unidades.

                </div>

            `;

            return;
        }


        let totalFinal =
            0;


        carrito.forEach(
            item => {

                totalFinal +=
                    precioMayorista(
                        item.producto,
                        total
                    ) *
                    item.cantidad;

            }
        );


        cont.innerHTML = `

            <div
            class="resumen-linea">

                <span>
                    Unidades
                </span>

                <strong>
                    ${total}
                </strong>

            </div>


            <div
            class="resumen-linea">

                <span>
                    Escala
                </span>

                <strong>
                    ${escapeHTML(
                        escalaMayorista(
                            total
                        )
                    )}
                </strong>

            </div>


            <div
            class="resumen-linea resumen-total">

                <span>
                    TOTAL
                </span>

                <strong>
                    ${dinero(
                        totalFinal
                    )}
                </strong>

            </div>

        `;

        return;
    }


    const calculo =
        calcularCarritoParticular();


    cont.innerHTML = `

        <div
        class="resumen-linea">

            <span>
                Subtotal
            </span>

            <strong>
                ${dinero(
                    calculo.precioNormal
                )}
            </strong>

        </div>


        ${
            calculo.ahorro > 0
            ?
            `
            <div
            class="resumen-linea">

                <span>
                    Ahorro
                </span>

                <strong>
                    -${dinero(
                        calculo.ahorro
                    )}
                </strong>

            </div>
            `
            :
            ""
        }


        <div
        class="resumen-linea resumen-total">

            <span>
                TOTAL
            </span>

            <strong>
                ${dinero(
                    calculo.totalFinal
                )}
            </strong>

        </div>

    `;
}


/* =========================================================
   ENVIAR WHATSAPP
   ========================================================= */

function enviarWhatsApp(){

    if(
        !carrito.length
    ){

        alert(
            "No hay productos en el pedido."
        );

        return;
    }


    if(
        modoActual ===
        "mayorista" &&
        totalUnidades() <
        MINIMO_MAYORISTA
    ){

        alert(
            `El pedido mayorista requiere mínimo ${MINIMO_MAYORISTA} unidades.`
        );

        return;
    }


    let mensaje =
        "Hola AKKINO Privé!%0A%0A";


    mensaje +=
        modoActual ===
        "mayorista"

        ?

        "Quiero realizar un pedido MAYORISTA:%0A%0A"

        :

        "Quiero realizar un pedido PARTICULAR:%0A%0A";


    carrito.forEach(
        item => {

            const producto =
                item.producto;


            let precioUnitario;


            if(
                modoActual ===
                "mayorista"
            ){

                precioUnitario =
                    precioMayorista(
                        producto,
                        Math.max(
                            totalUnidades(),
                            MINIMO_MAYORISTA
                        )
                    );

            }

            else{

                const original =
                    tipoPrincipalProducto(
                        producto
                    ) ===
                    "ORIGINALES";


                if(original){

                    const precios =
                        precioOriginal(
                            producto
                        );

                    precioUnitario =
                        precios.final;

                }

                else{

                    precioUnitario =
                        precioParticularProducto(
                            producto
                        );
                }
            }


            mensaje +=
                `${item.cantidad} x ${encodeURIComponent(
                    producto.perfume
                )} - ${encodeURIComponent(
                    dinero(
                        precioUnitario
                    )
                )}%0A`;

        }
    );


    mensaje +=
        "%0A";


    if(
        modoActual ===
        "particular"
    ){

        const calculo =
            calcularCarritoParticular();


        mensaje +=
            `TOTAL: ${encodeURIComponent(
                dinero(
                    calculo.totalFinal
                )
            )}%0A`;

    }

    else{

        let totalFinal =
            0;


        const unidades =
            totalUnidades();


        carrito.forEach(
            item => {

                totalFinal +=
                    precioMayorista(
                        item.producto,
                        unidades
                    ) *
                    item.cantidad;

            }
        );


        mensaje +=
            `TOTAL MAYORISTA: ${encodeURIComponent(
                dinero(
                    totalFinal
                )
            )}%0A`;

    }


    if(
        modoActual ===
        "particular"
    ){

        mensaje +=
            `FORMA DE PAGO: ${encodeURIComponent(
                formaPagoActual
            )}%0A`;

    }


    mensaje +=
        "%0AGracias!";


    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        mensaje;


    window.open(
        url,
        "_blank"
    );
}


/* =========================================================
   CERRAR MODAL TOCANDO AFUERA
   ========================================================= */

document
.getElementById(
    "modalCarrito"
)
.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            this
        ){

            cerrarCarrito();

        }

    }
);
