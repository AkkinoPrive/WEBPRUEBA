<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AKKINO | Catálogo Oficial</title>

<link
rel="icon"
type="image/png"
href="favicon.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    linear-gradient(180deg, #0b0b0b 0%, #111111 48%, #090909 100%);

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:#fff;
    min-height:100vh;
}

/* =========================================================
   LANDING / HOME
   ========================================================= */

html{
    scroll-behavior:smooth;
}

body{
    overflow-x:hidden;
}

.landing-page{
    position:fixed;
    inset:0;
    z-index:9000;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg, #050505 0%, #111111 50%, #070707 100%);
    display:flex;
    flex-direction:column;
    transition:
        opacity .45s ease,
        visibility .45s ease,
        transform .45s ease;
}

.landing-page.oculto{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:scale(1.025);
}

.landing-page:before{
    content:"";
    position:absolute;
    inset:5%;
    border:1px solid rgba(212,175,55,.12);
    pointer-events:none;
}

.landing-noise{
    position:absolute;
    inset:0;
    opacity:.035;
    pointer-events:none;
    background-image:
        repeating-linear-gradient(
            0deg,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 4px
        );
    mix-blend-mode:soft-light;
}

.landing-topbar{
    position:relative;
    z-index:3;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px 38px;
}

.menu-trigger,
.landing-cart{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid rgba(212,175,55,.30);
    background:rgba(12,12,12,.72);
    color:#d4af37;
    cursor:pointer;
    backdrop-filter:blur(10px);
}

.menu-trigger{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    padding:0 14px;
}

.menu-trigger span{
    width:19px;
    height:1px;
    background:#d4af37;
    display:block;
}

.landing-cart{
    font-size:18px;
}

.landing-mini-logo{
    text-align:center;
}

.landing-logo{
    font-family:
        Georgia,
        "Times New Roman",
        serif;
    color:#d4af37;
    font-size:28px;
    letter-spacing:8px;
}

.landing-logo-sub{
    margin-top:4px;
    color:#777;
    font-size:9px;
    letter-spacing:5px;
}

.landing-center{
    position:relative;
    z-index:2;
    width:min(820px, 90%);
    margin:auto;
    text-align:center;
    transform:translateY(-2%);
}

.landing-eyebrow{
    color:#d4af37;
    font-size:10px;
    letter-spacing:6px;
    margin-bottom:22px;
}

.landing-center h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;
    font-size:clamp(48px, 7vw, 92px);
    line-height:.93;
    font-weight:400;
    letter-spacing:-2px;
    color:#f5f5f5;
}

.landing-center h1 span{
    color:#d4af37;
    font-style:italic;
}

.landing-center p{
    max-width:610px;
    margin:28px auto 0;
    color:#9b9b9b;
    font-size:14px;
    line-height:1.8;
}

.landing-divider{
    width:250px;
    margin:28px auto 14px;
    display:flex;
    align-items:center;
    gap:12px;
    color:#d4af37;
}

.landing-divider span{
    flex:1;
    height:1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(212,175,55,.55)
        );
}

.landing-divider span:last-child{
    background:
        linear-gradient(
            90deg,
            rgba(212,175,55,.55),
            transparent
        );
}

.landing-divider b{
    font-family:Georgia,serif;
    font-weight:400;
    font-size:12px;
    letter-spacing:2px;
}

.landing-meta{
    display:none;
    color:#777;
    font-size:9px;
    letter-spacing:3px;
}

.landing-meta i{
    color:#d4af37;
    font-style:normal;
    margin:0 8px;
}

.landing-cta{
    margin-top:30px;
    border:1px solid #d4af37;
    background:#d4af37;
    color:#0b0b0b;
    padding:15px 26px;
    min-width:240px;
    border-radius:2px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.25s;
}

.landing-cta span{
    margin-left:12px;
    font-size:17px;
}

.landing-cta:hover{
    background:#efd36b;
    transform:translateY(-2px);
}

.landing-secondary{
    display:block;
    margin:14px auto 0;
    border:0;
    background:transparent;
    color:#777;
    font-size:10px;
    letter-spacing:2px;
    cursor:pointer;
}

.landing-secondary:hover{
    color:#d4af37;
}

.landing-bottom{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:space-between;
    align-items:end;
    padding:26px 38px;
    color:#777;
}

.landing-bottom small{
    display:block;
    font-size:8px;
    letter-spacing:3px;
    margin-bottom:5px;
}

.landing-bottom strong{
    color:#aaa;
    font-size:10px;
    letter-spacing:3px;
}

.landing-socials{
    display:flex;
    gap:18px;
}

.landing-socials a{
    color:#888;
    text-decoration:none;
    font-size:9px;
    letter-spacing:2px;
}

.landing-socials a:hover{
    color:#d4af37;
}

.landing-glow{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(1px);
}

.glow-one{
    width:520px;
    height:520px;
    right:-280px;
    top:18%;
    border:1px solid rgba(212,175,55,.16);
    box-shadow:
        0 0 0 45px rgba(212,175,55,.025),
        0 0 0 90px rgba(212,175,55,.015);
}

.glow-two{
    width:360px;
    height:360px;
    left:-240px;
    bottom:-170px;
    border:1px solid rgba(212,175,55,.10);
}


/* =========================================================
   MENÚ LATERAL
   ========================================================= */

.menu-backdrop{
    position:fixed;
    inset:0;
    z-index:9500;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(4px);
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.menu-backdrop.abierto{
    opacity:1;
    visibility:visible;
}

.side-menu{
    position:fixed;
    z-index:9600;
    left:0;
    top:0;
    bottom:0;
    width:min(360px, 88vw);
    padding:28px 24px;
    background:
        linear-gradient(
            180deg,
            #111 0%,
            #070707 100%
        );
    border-right:1px solid rgba(212,175,55,.20);
    box-shadow:25px 0 70px rgba(0,0,0,.65);
    transform:translateX(-105%);
    transition:transform .35s cubic-bezier(.22,.61,.36,1);
    overflow-y:auto;
}

.side-menu.abierto{
    transform:translateX(0);
}

.side-menu-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:24px;
    margin-bottom:22px;
    border-bottom:1px solid #222;
}

.side-menu-head small{
    display:block;
    color:#777;
    font-size:8px;
    letter-spacing:3px;
}

.side-menu-head strong{
    display:block;
    margin-top:5px;
    color:#d4af37;
    font-family:Georgia,serif;
    letter-spacing:5px;
}

.menu-close{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #333;
    background:#151515;
    color:#aaa;
    font-size:25px;
    cursor:pointer;
}

.side-menu-section{
    margin-bottom:26px;
}

.side-menu-section > small{
    display:block;
    margin-bottom:10px;
    color:#666;
    font-size:8px;
    letter-spacing:3px;
}

.side-menu-section button,
.side-menu-section a{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    padding:12px 10px;
    margin:3px 0;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#aaa;
    text-decoration:none;
    text-align:left;
    font-size:11px;
    letter-spacing:.5px;
    cursor:pointer;
}

.side-menu-section button:hover,
.side-menu-section a:hover{
    background:#171717;
    color:#d4af37;
}

.side-menu-section button span,
.side-menu-section a span{
    width:22px;
    color:#d4af37;
    text-align:center;
}

.side-social{
    padding-top:8px;
    border-top:1px solid #222;
}


/* =========================================================
   CATÁLOGO COMO "SEGUNDA PÁGINA"
   ========================================================= */

.catalog-page{
    min-height:100vh;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(15px);
    transition:
        opacity .45s ease,
        transform .45s ease,
        visibility .45s ease;
}

.catalog-page.visible{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translateY(0);
}

.catalog-floating-bar{
    position:fixed;
    z-index:7000;
    right:22px;
    top:22px;
    display:flex;
    gap:7px;
    padding:7px;
    border:1px solid #292929;
    border-radius:999px;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(12px);
    box-shadow:0 12px 35px rgba(0,0,0,.4);
}

.catalog-menu-btn,
.catalog-home-btn,
.catalog-social{
    height:34px;
    min-width:34px;
    padding:0 11px;
    border-radius:999px;
    border:1px solid #2d2d2d;
    background:#111;
    color:#aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:9px;
    letter-spacing:1px;
    cursor:pointer;
}

.catalog-menu-btn:hover,
.catalog-home-btn:hover,
.catalog-social:hover{
    color:#d4af37;
    border-color:rgba(212,175,55,.4);
}

.catalog-home-btn{
    font-family:Georgia,serif;
    color:#d4af37;
    letter-spacing:3px;
}

.catalog-social.whatsapp:hover{
    color:#62d47e;
}

.catalog-social.instagram:hover{
    color:#e9a0c0;
}

#catalogInner{
    position:relative;
}




/* =========================================================
   BIENVENIDA DEL CATÁLOGO
   ========================================================= */

.catalog-welcome{
    margin-top:26px;
}

.catalog-welcome .hero-panel{
    min-height:0;
    padding:42px 46px;
}

.catalog-welcome .hero-copy{
    max-width:none;
    width:100%;
}

.catalog-welcome .hero-title{
    max-width:850px;
    font-size:clamp(30px,4vw,48px);
    line-height:1.05;
}

.catalog-welcome .hero-title span{
    color:#d4af37;
    font-style:italic;
}

.catalog-welcome .hero-text{
    max-width:800px;
    margin-top:15px;
}

.catalog-welcome-grid{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:
        repeat(3,minmax(0,1fr));
    gap:12px;
    margin-top:28px;
}

.welcome-card{
    position:relative;
    min-height:145px;
    padding:20px;
    border:1px solid #292929;
    border-radius:12px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );
    color:#fff;
    text-align:left;
    cursor:pointer;
    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.welcome-card:hover{
    transform:translateY(-3px);
    border-color:rgba(212,175,55,.55);
    background:
        linear-gradient(
            145deg,
            rgba(212,175,55,.10),
            rgba(255,255,255,.018)
        );
}

.welcome-icon{
    color:#d4af37;
    font-family:Georgia,serif;
    font-size:20px;
    margin-bottom:14px;
}

.welcome-card strong{
    display:block;
    color:#e0e0e0;
    font-size:11px;
    letter-spacing:1.5px;
    margin-bottom:7px;
}

.welcome-card span{
    display:block;
    max-width:240px;
    color:#858585;
    font-size:11px;
    line-height:1.55;
}

.welcome-card b{
    position:absolute;
    left:20px;
    bottom:18px;
    color:#d4af37;
    font-size:9px;
    letter-spacing:1.3px;
}

.welcome-originales{
    border-color:rgba(212,175,55,.20);
}

@media(max-width:800px){

    .catalog-welcome .hero-panel{
        padding:30px 22px;
    }

    .catalog-welcome-grid{
        grid-template-columns:1fr;
    }

    .welcome-card{
        min-height:125px;
    }

}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

    .landing-topbar{
        padding:18px;
    }

    .landing-logo{
        font-size:23px;
        letter-spacing:6px;
    }

    .landing-center{
        width:86%;
    }

    .landing-center h1{
        font-size:48px;
        letter-spacing:-1px;
    }

    .landing-center p{
        font-size:12px;
        line-height:1.7;
    }

    .landing-meta{
        font-size:8px;
        line-height:1.8;
    }

    .landing-bottom{
        padding:18px;
    }

    .landing-socials{
        gap:10px;
    }

    .catalog-floating-bar{
        right:10px;
        top:10px;
    }

}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    width:100%;
    text-align:center;
    padding:34px 20px 18px;
}

.marca{
    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:32px;
    letter-spacing:9px;
    color:#d4af37;
    text-shadow:0 0 24px rgba(212,175,55,.18);
}

.subtitulo{
    margin-top:8px;
    font-size:11px;
    letter-spacing:5px;
    color:#aaa;
}

/* =========================================================
   MODOS
   ========================================================= */

.modos{
    max-width:560px;
    margin:18px auto;
    display:flex;
    gap:10px;
    padding:0 15px;
}

.modo{
    flex:1;
    border:none;
    padding:15px 10px;
    border-radius:10px;
    background:#111;
    border:1px solid #252525;
    color:#aaa;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.modo:hover{
    background:#222;
}

.modo.activo{
    background:#e3c25b;
    color:#111;
}

/* =========================================================
   BUSCADOR
   ========================================================= */

.buscar-contenedor{
    max-width:1040px;
    margin:22px auto 14px;
    padding:0 15px;
}

#buscar{
    width:100%;
    border:1px solid #252525;
    outline:none;
    padding:18px 20px;
    border-radius:12px;
    background:#101010;
    color:#fff;
    font-size:15px;
}

#buscar::placeholder{
    color:#888;
}


/* =========================================================
   HERO / EXPERIENCIA TIENDA
   ========================================================= */

.hero-akkino{
    max-width:1040px;
    margin:18px auto 28px;
    padding:0 15px;
}

.hero-panel{
    position:relative;
    overflow:hidden;
    min-height:270px;
    border:1px solid rgba(212,175,55,.35);
    border-radius:20px;
    background:
        radial-gradient(
            circle at 85% 20%,
            rgba(212,175,55,.20),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #151515,
            #080808 70%
        );
    box-shadow:
        0 18px 55px rgba(0,0,0,.45),
        inset 0 0 60px rgba(212,175,55,.035);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:38px 46px;
}

.hero-panel:after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    right:-130px;
    bottom:-170px;
    border-radius:50%;
    border:1px solid rgba(212,175,55,.20);
    box-shadow:
        0 0 0 28px rgba(212,175,55,.025),
        0 0 0 58px rgba(212,175,55,.018);
}

.hero-copy{
    position:relative;
    z-index:2;
    max-width:620px;
}

.hero-kicker{
    color:#d4af37;
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.hero-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:38px;
    line-height:1.05;
    letter-spacing:1px;
    margin-bottom:12px;
}

.hero-text{
    color:#aaa;
    font-size:14px;
    line-height:1.6;
    max-width:560px;
}

.hero-promo{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

.hero-chip{
    border:1px solid rgba(212,175,55,.35);
    background:rgba(212,175,55,.08);
    color:#e5c45b;
    border-radius:999px;
    padding:8px 12px;
    font-size:11px;
}

.hero-btn{
    margin-top:20px;
    border:1px solid #d4af37;
    background:#d4af37;
    color:#111;
    border-radius:9px;
    padding:12px 20px;
    font-weight:bold;
    cursor:pointer;
}

.hero-btn:hover{
    background:#e2c45d;
}

.seccion-tienda{
    max-width:1040px;
    margin:0 auto 12px;
    padding:0 15px;
    display:flex;
    align-items:end;
    justify-content:space-between;
}

.seccion-tienda h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    font-weight:normal;
    letter-spacing:1px;
}

.seccion-tienda span{
    color:#777;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* =========================================================
   CATEGORIAS
   ========================================================= */

.categorias{
    max-width:1100px;
    margin:20px auto;
    padding:0 15px;
}

.categorias-principales{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.subcategorias{
    margin-top:12px;
}

.filtros-extra{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.categoria-btn{
    border:none;
    padding:11px 17px;
    border-radius:25px;
    background:#171717;
    color:#aaa;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.categoria-btn:hover{
    background:#252525;
    color:#fff;
}

.categoria-btn.activa{
    background:#d4af37;
    color:#111;
}

.filtro-extra{
    border:1px solid #333;
    padding:8px 14px;
    border-radius:20px;
    background:#111;
    color:#aaa;
    cursor:pointer;
    font-size:12px;
}

.filtro-extra:hover{
    color:#fff;
    border-color:#666;
}

.filtro-extra.activo{
    background:#d4af37;
    border-color:#d4af37;
    color:#111;
}

/* =========================================================
   PRODUCTOS
   ========================================================= */

#productos{
    max-width:1280px;
    margin:25px auto;
    padding:0 15px;

    display:grid;
    grid-template-columns:
    repeat(
        auto-fit,
        minmax(230px,1fr)
    );

    gap:20px;
}

.producto{
    background:
        linear-gradient(
            180deg,
            #171717,
            #101010
        );
    color:#fff;
    border-radius:16px;
    border:1px solid #252525;
    overflow:hidden;
    box-shadow:
    0 8px 30px rgba(0,0,0,.3);

    display:flex;
    flex-direction:column;

    transition:
    transform .2s,
    box-shadow .2s;
}

.producto:hover{
    transform:translateY(-3px);
    box-shadow:
    0 12px 35px rgba(0,0,0,.45);
}

.producto-imagen{
    width:100%;
    height:260px;
    background:#f4f4f4;
    border-bottom:1px solid #252525;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.producto-imagen img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.producto-info{
    padding:17px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.producto-nombre{
    font-size:16px;
    font-weight:bold;
    line-height:1.25;
}

.categoria-producto{
    font-size:11px;
    color:#8f8f8f;
    text-transform:uppercase;
}

.precio-label{
    font-size:10px;
    color:#888;
    margin-top:5px;
}

.precio{
    font-size:24px;
    font-weight:bold;
    color:#f4f4f4;
}

.precio-original-lista{
    color:#999;
    text-decoration:line-through;
    font-size:14px;
}

.precio-original-descuento{
    font-size:24px;
    font-weight:bold;
    color:#f4f4f4;
}

.original-detalle{
    font-size:11px;
    color:#9a9a9a;
    line-height:1.4;
}

.stock{
    font-size:11px;
    font-weight:bold;

/* =========================================================
   UTILIDADES
   ========================================================= */

function numero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){
        return 0;
    }

    if(
        typeof valor ===
        "number"
    ){
        return valor;
    }

    let texto =
        String(valor)
        .trim()
        .replace(/ARS/gi,"")
        .replace(/\$/g,"")
        .replace(/\s/g,"");

    if(
        texto.includes(".") &&
        texto.includes(",")
    ){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }

    else if(
        texto.includes(",")
    ){

        texto =
            texto.replace(",",".");
    }

    const resultado =
        Number(texto);

    return isNaN(resultado)
        ? 0
        : resultado;
}


function dinero(valor){

    const numeroValor =
        numero(valor);

    return numeroValor.toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            maximumFractionDigits:0
        }
    );
}


function texto(valor){

    if(
        valor === null ||
        valor === undefined
    ){
        return "";
    }

    return String(valor).trim();
}


function normalizar(valor){

    return texto(valor)
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toUpperCase()
        .trim();
}


function escapeHTML(text){

    return texto(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeJS(text){

    return texto(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        );
}


/* =========================================================
   ESTADO
   ========================================================= */

function obtenerEstado(producto){

    const estado =
        normalizar(
            producto.estado
        );

    if(!estado){
        return "DISPONIBLE";
    }

    if(
        estado.includes("SIN STOCK") ||
        estado.includes("AGOTADO")
    ){
        return "SIN STOCK";
    }

    if(
        estado.includes("PEDIDO") ||
        estado.includes("RESERVA")
    ){
        return "A PEDIDO";
    }

    if(
        estado.includes("DISPONIBLE") ||
        estado.includes("STOCK")
    ){
        return "DISPONIBLE";
    }

    return estado;
}


function estadoTexto(producto){

    const estado =
        obtenerEstado(producto);

    return estado ||
        "DISPONIBLE";
}


function stockClase(producto){

    const estado =
        obtenerEstado(producto);

    if(
        estado ===
        "SIN STOCK"
    ){
        return "sin-stock";
    }

    if(
        estado ===
        "A PEDIDO"
    ){
        return "pedido";
    }

    return "disponible";
}


/* =========================================================
   PRECIOS ORIGINALES
   ========================================================= */

function precioOriginal(producto){

    /*
    ORIGINALES — estructura definitiva de precios:

    valorReal de Google Sheets = precio FINAL
    efectivo / transferencia.

    Precio de lista = final + 40%
    2 cuotas = 20% menos que el precio de lista.
    */

    const precioFinal =
        numero(producto.valorReal) > 0
        ? numero(producto.valorReal)
        : numero(producto.precioParticular);

    const cuotas = 2;

    const precioLista =
        precioFinal > 0
        ? Math.round(precioFinal * 1.40)
        : 0;

    const precioCuotas =
        precioLista > 0
        ? Math.round(precioLista * 0.80)
        : 0;

    const valorCuota =
        precioCuotas > 0
        ? Math.round(precioCuotas / cuotas)
        : 0;

    return {
        final: precioFinal,
        precioCuotas: precioCuotas,
        lista: precioLista,
        cuotas: cuotas,
        valorCuota: valorCuota
    };
}

function precioOriginalSegunPago(producto){

    const precios = precioOriginal(producto);

    if(formaPagoActual === "TARJETA_2_CUOTAS"){
        return precios.precioCuotas;
    }

    return precios.final;
}

function precioParticularProducto(producto){

    const precioParticular =
        numero(
            producto.precioParticular
        );

    if(precioParticular > 0){
        return precioParticular;
    }

    return numero(
        producto.valorReal
    );
}


function descuentoTexto(producto){

    let descuento =
        numero(
            producto.descuento
        );

    if(!descuento){
        return "";
    }

    // Google Sheets puede entregar 10% como 0.10,
    // o el valor como -0.10. Siempre mostramos 10%.
    const signo =
        descuento < 0
        ? -1
        : 1;

    descuento =
        Math.abs(descuento);

    if(
        descuento > 0 &&
        descuento < 1
    ){
        descuento *= 100;
    }

    descuento =
        Math.round(
            descuento * 100
        ) / 100;

    const tipo =
        String(
            producto.tipoDescuento || ""
        ).trim();

    return (
        "-" +
        String(descuento) +
        "%" +
        (
            tipo
            ? " " + tipo
            : ""
        )
    );
}


function formaPagoProducto(producto){

    const forma =
        normalizar(
            producto.formaPago
        );

    if(!forma){
        return "";
    }

    return forma;
}


/* =========================================================
   CARGAR API - JSONP
   =========================================================
   Apps Script responde como:
   callback([...])

   No usamos fetch() porque la API está en otro dominio
   y JSONP evita el problema de CORS.
   ========================================================= */

function cargarPerfumes(){

    const callbackName =
        "__akkinoJSONP_" +
        Date.now();

    const script =
        document.createElement("script");

    let finalizado = false;


    function limpiar(){

        try{
            delete window[callbackName];
        }
        catch(error){
            window[callbackName] =
                undefined;
        }

        if(script.parentNode){
            script.parentNode.removeChild(script);
        }
    }


    function mostrarError(error){

        console.error(
            "Error cargando perfumes:",
            error
        );

        document
        .getElementById(
            "productos"
        )
        .innerHTML = `

            <div
            class="mensaje-vacio">

                No se pudieron cargar
                los perfumes.

                <br><br>

                <small>
                    ${escapeHTML(
                        error &&
                        error.message
                        ?
                        error.message
                        :
                        "Error de conexión con la API."
                    )}
                </small>

            </div>

        `;
    }


    window[callbackName] =
        function(data){

            if(finalizado){
                return;
            }

            finalizado = true;

            limpiar();


            if(
                !Array.isArray(data)
            ){

                const mensaje =
                    data &&
                    data.error
                    ?
                    data.error
                    :
                    "Respuesta inválida de la API.";

                mostrarError(
                    new Error(
                        mensaje
                    )
                );

                return;
            }


            perfumes =
                data;


            renderHomeShowcasesV11();

            crearCategorias();

            aplicarFiltros();

        };


    script.onerror =
        function(){

            if(finalizado){
                return;
            }

            finalizado = true;

            limpiar();

            mostrarError(
                new Error(
                    "No se pudo conectar con la API de AKKINO."
                )
            );

        };


    const separador =
        API.includes("?")
        ? "&"
        : "?";


    script.src =
        API +
        separador +
        "callback=" +
        encodeURIComponent(
            callbackName
        ) +
        "&_=" +
        Date.now();


    script.async = true;

    document
    .head
    .appendChild(
        script
    );
}

/* =========================================================
   CATEGORÍA / TIPO PRINCIPAL
   =========================================================
   La categoría principal NO se pierde cuando aplicamos
   filtros secundarios como STOCK, NUEVOS INGRESOS o
   SIN STOCK.
   ========================================================= */

function tipoPrincipalProducto(producto){

    const tipo =
        normalizar(
            producto.tipo
        );


    if(
        tipo.includes(
            "ORIGINAL"
        )
    ){

        return "ORIGINALES";
    }


    if(
        tipo.includes(
            "INSPIRACION"
        )
    ){

        return "INSPIRACIONES 60ML";
    }


    return tipo;
}


function categoriaCoincide(
    producto,
    categoriaBuscada
){

    const buscada =
        normalizar(
            categoriaBuscada
        );

    const valor =
        normalizar(
            producto.categoria
        );


    if(!buscada){
        return true;
    }


    /*
    Permite:
    MASCULINOS
    FEMENINOS
    UNISEX

    y también valores múltiples como:
    MASCULINOS, UNISEX
    MASCULINOS / UNISEX
    */

    const categorias =
        valor
        .split(
            /[,;|/]+/
        )
        .map(
            x => normalizar(x)
        )
        .filter(Boolean);


    return categorias.some(
        categoria =>
            categoria ===
            buscada
    );
}


function nuevoIngresoProducto(
    producto
){

    const valor =
        normalizar(
            producto.nuevoIngreso
        );


    return (
        valor === "SI" ||
        valor === "SÍ" ||
        valor === "TRUE" ||
        valor === "1" ||
        valor === "NUEVO" ||
        valor === "NUEVOS INGRESOS"
    );
}



/* =========================================================
   APLICAR FILTROS
   ========================================================= */

function aplicarFiltros(){

    const textoBusqueda =
        normalizar(
            document
            .getElementById(
                "buscar"
            )
            .value
        );


    productosFiltrados =
        perfumes.filter(
            producto => {

                const nombre =
                    normalizar(
                        producto.perfume
                    );

                const categoria =
                    normalizar(
                        producto.categoria
                    );

                const tipo =
                    tipoPrincipalProducto(
                        producto
                    );

                const nuevoIngreso =
                    normalizar(
                        producto.nuevoIngreso
                    );

                const estado =
                    obtenerEstado(
                        producto
                    );


                /*
                ---------------------------------------------
                BUSQUEDA
                ---------------------------------------------
                */

                const coincideBusqueda =
                    !textoBusqueda ||
                    nombre.includes(
                        textoBusqueda
                    ) ||
                    categoria.includes(
                        textoBusqueda
                    ) ||
                    tipo.includes(
                        textoBusqueda
                    );


                if(
                    !coincideBusqueda
                ){
                    return false;
                }


                /*
                ---------------------------------------------
                TIPO PRINCIPAL
                ---------------------------------------------
                */

                let coincideTipo =
                    true;

                if(
                    tipoActual !==
                    "TODOS"
                ){

                    coincideTipo =
                        tipo ===
                        normalizar(
                            tipoActual
                        );
                }


                if(
                    !coincideTipo
                ){
                    return false;
                }

                // No se ofrecen perfumes ORIGINALES en mayorista.
                if(
                    modoActual === "mayorista" &&
                    tipo === "ORIGINALES"
                ){
                    return false;
                }


                /*
                ---------------------------------------------
                FILTRO EXTRA
                ---------------------------------------------
                */

                let coincideExtra =
                    true;


                switch(
                    filtroExtraActual
                ){

                    case "MASCULINOS":

                        coincideExtra =
                            categoriaCoincide(
                                producto,
                                "MASCULINOS"
                            );

                        break;


                    case "FEMENINOS":

                        coincideExtra =
                            categoriaCoincide(
                                producto,
                                "FEMENINOS"
                            );

                        break;


                    case "UNISEX":

                        coincideExtra =
                            categoriaCoincide(
                                producto,
                                "UNISEX"
                            );

                        break;


                    case "EN STOCK":

                        coincideExtra =
                            estado ===
                            "DISPONIBLE";

                        break;
case "DISPONIBLES":

                        coincideExtra =
                            estado ===
                            "DISPONIBLE";

                        break;


                    case "A PEDIDO":

                        coincideExtra =
                            estado ===
                            "A PEDIDO";

                        break;


                    default:

                        coincideExtra =
                            true;

                        break;

                }


                return coincideExtra;

            }
        );


    mostrarPagina();
}

let mayoristaSlideActual = 0;
let mayoristaIntervalo = null;

function actualizarHeroModo(){

    const heroParticular =
        document.getElementById("heroParticular");

    const heroMayorista =
        document.getElementById("heroMayorista");

    if(!heroParticular || !heroMayorista){
        return;
    }

    const esMayorista =
        modoActual === "mayorista";

    heroParticular.style.display =
        esMayorista
        ? "none"
        : "block";

    heroMayorista.style.display =
        esMayorista
        ? "block"
        : "none";

    if(esMayorista){

        prepararImagenesMayorista();

        iniciarCarruselMayorista();

    }else{

        detenerCarruselMayorista();

    }
}


function prepararImagenesMayorista(){

    if(
        !Array.isArray(perfumes) ||
        !perfumes.length
    ){
        return;
    }

    /*
    Usamos imágenes reales del catálogo como soporte visual
    del carrusel. No se agregan imágenes externas.
    */
    const disponibles =
        perfumes
        .filter(
            p =>
                texto(p.foto) &&
                tipoPrincipalProducto(p) !== "ORIGINALES"
        )
        .slice(0,3);

    disponibles.forEach(
        (producto,index) => {

            const img =
                document.getElementById(
                    `mayoristaImagen${index}`
                );

            if(!img){
                return;
            }

            img.src =
                texto(producto.foto);

            img.alt =
                texto(producto.perfume) ||
                "AKKINO Privé";

        }
    );
}


function irSlideMayorista(indice){

    const slides =
        document.querySelectorAll(
            ".mayorista-slide"
        );

    const dots =
        document.querySelectorAll(
            "#mayoristaDots button"
        );

    if(!slides.length){
        return;
    }

    mayoristaSlideActual =
        (indice + slides.length) %
        slides.length;

    slides.forEach(
        (slide,index) => {

            slide.classList.toggle(
                "activa",
                index ===
                mayoristaSlideActual
            );

        }
    );

    dots.forEach(
        (dot,index) => {

            dot.classList.toggle(
                "activo",
                index ===
                mayoristaSlideActual
            );

        }
    );
}


function cambiarSlideMayorista(direccion){

    irSlideMayorista(
        mayoristaSlideActual +
        direccion
    );

}


function iniciarCarruselMayorista(){

    detenerCarruselMayorista();

    mayoristaIntervalo =
        setInterval(
            () => {

                if(
                    modoActual ===
                    "mayorista"
                ){

                    cambiarSlideMayorista(1);

                }

            },
            7500
        );

}


function detenerCarruselMayorista(){

    if(
        mayoristaIntervalo
    ){

        clearInterval(
            mayoristaIntervalo
        );

        mayoristaIntervalo =
            null;

    }

}


function cambiarModo(modo){

    modoActual =
        modo;

    // Los originales se venden solamente en particular.
    // Si pasamos a mayorista estando dentro de ORIGINALES,
    // volvemos automáticamente a TODOS.
    if(
        modoActual === "mayorista" &&
        tipoActual === "ORIGINALES"
    ){
        tipoActual =
            "INSPIRACIONES 60ML";

        filtroExtraActual =
            "TODOS";
    }

    crearCategorias();

    document
    .getElementById(
        "modoParticular"
    )
    .classList.toggle(
        "activo",
        modo ===
        "particular"
    );

    document
    .getElementById(
        "modoMayorista"
    )
    .classList.toggle(
        "activo",
        modo ===
        "mayorista"
    );

    actualizarHeroModo();

    // Los originales no pueden permanecer en un pedido mayorista.
    if(
        modoActual === "mayorista"
    ){
        carrito =
            carrito.filter(
                item =>
                    tipoPrincipalProducto(
                        item.producto
                    ) !== "ORIGINALES"
            );
    }

    paginaActual = 1;

    mostrarPagina();

    actualizarCarrito();

}

function precioMayorista(
    producto,
    cantidad
){

    const escalas = [
        {
            min:100,
            precio:
                numero(
                    producto.precio100
                )
        },
        {
            min:50,
            precio:
                numero(
                    producto.precio50
                )
        },
        {
            min:30,
            precio:
                numero(
                    producto.precio30
                )
        },
        {
            min:20,
            precio:
                numero(
                    producto.precio20
                )
        },
        {
            min:10,
            precio:
                numero(
                    producto.precio10
                )
        },
        {
            min:5,
            precio:
                numero(
                    producto.precio5
                )
        }
    ];


    for(
        const escala
        of escalas
    ){

        if(
            cantidad >=
            escala.min &&
            escala.precio > 0
        ){

            return escala.precio;
        }
    }


    return numero(
        producto.precio5
    );
}

){

    if(total >= 50)

    if(total >= 30)
        return "30 unidades";

    if(total >= 20)
        return "20 unidades";

    if(total >= 10)
        return "10 unidades";

    if(total >= 5)
        return "5 unidades";

    return "Menos de 5 unidades";
}


function proximaEscala(

){

    const escalas = [
        5,
        10,
        20,
        30,
        50,
        100
    ];

    for(
        const escala
        of escalas
    ){

        if(
            total < escala
        ){

            return escala;
        }
    }

    return null;
}


/* =========================================================
   PROMOCIONES PARTICULAR
   ========================================================= */

function calcularCarritoParticular(){

    let precioNormal = 0;

    let unidadesInspiraciones = 0;

    let promo2 = 0;

    let promo3 = 0;

    /*
    Las promociones 2x35 y 3x50 son promociones
    GENERALES del pedido de inspiraciones.
    No hace falta que sean dos o tres unidades
    del mismo perfume.
    */

    carrito.forEach(
        item => {

            const producto =
                item.producto;

            const cantidad =
                item.cantidad;

            const tipo =
                tipoPrincipalProducto(
                    producto
                );

            const unitario =
                tipo === "ORIGINALES"
                ? precioOriginalSegunPago(producto)
                : precioParticularProducto(producto);

            precioNormal +=
                unitario * cantidad;


            /*
            Solamente las inspiraciones
            participan de 2x35 / 3x50.
            */

            if(
                tipo ===
                "INSPIRACIONES 60ML"
            ){

                unidadesInspiraciones +=
                    cantidad;

                if(!promo2){

                    promo2 =
                        numero(
                            producto.promo2
                        );

                }

                if(!promo3){

                    promo3 =
                        numero(
                            producto.promo3
                        );

                }

            }

        }
    );


    /*
    Si por algún motivo la API no trae promo2/promo3,
    usamos los valores actuales de AKKINO.
    */

    if(
        !promo2
    ){

        promo2 = 35000;

    }

    if(
        !promo3
    ){

        promo3 = 50000;

    }


    /*
    Calculamos la mejor combinación:

    3 unidades -> promo3
    2 unidades -> promo2
    1 unidad   -> precio normal

    Ejemplos:
    1 = 20.000
    2 = 35.000
    3 = 50.000
    4 = 70.000
    5 = 85.000
    6 = 100.000
    */

    let mejorTotalPromos =
        unidadesInspiraciones *
        20000;


    /*
    Usamos el precio real de las unidades
    restantes. Para que funcione aunque haya
    precios particulares distintos, primero
    armamos el precio normal de las inspiraciones.
    */

    let precioNormalInspiraciones = 0;

    carrito.forEach(
        item => {

            if(
                tipoPrincipalProducto(
                    item.producto
                ) ===
                "INSPIRACIONES 60ML"
            ){

                precioNormalInspiraciones +=
                    precioParticularProducto(
                        item.producto
                    ) *
                    item.cantidad;

            }

        }
    );


    mejorTotalPromos =
        precioNormalInspiraciones;


    let mejorDetalle =
        [];


    /*
    Probamos todas las cantidades posibles
    de promociones de 3 y 2 unidades y nos
    quedamos con el menor total.
    */

    for(
        let cantidad3 = 0;
        cantidad3 <=
        Math.floor(
            unidadesInspiraciones / 3
        );
        cantidad3++
    ){

        for(
            let cantidad2 = 0;
            cantidad2 <=
            Math.floor(
                (
                    unidadesInspiraciones -
                    cantidad3 * 3
                ) / 2
            );
            cantidad2++
        ){

            const restantes =
                unidadesInspiraciones -
                cantidad3 * 3 -
                cantidad2 * 2;


            /*
            Para las unidades restantes usamos
            un promedio/precio unitario real.
            */

            const precioUnitarioPromedio =
                unidadesInspiraciones > 0
                ?
                precioNormalInspiraciones /
                unidadesInspiraciones
                :
                0;


            const totalCombinacion =
                cantidad3 * promo3 +
                cantidad2 * promo2 +
                restantes *
                precioUnitarioPromedio;


            if(
                totalCombinacion <
                mejorTotalPromos
            ){

                mejorTotalPromos =
                    totalCombinacion;

                mejorDetalle = [];

                if(cantidad3){

                    mejorDetalle.push(
                        `${cantidad3} promo 3 unidades`
                    );

                }

                if(cantidad2){

                    mejorDetalle.push(
                        `${cantidad2} promo 2 unidades`
                    );

                }

            }

        }

    }


    /*
    Total de originales + total promocional
    de inspiraciones.
    */

    let totalOriginales =
        0;


    carrito.forEach(
        item => {

            if(
                tipoPrincipalProducto(
                    item.producto
                ) ===
                "ORIGINALES"
            ){

                totalOriginales +=
                    precioOriginal(
                        item.producto
                    ).final *
                    item.cantidad;

            }

        }
    );


    const totalFinal =
        totalOriginales +
        mejorTotalPromos;


    return {

        precioNormal:
            precioNormal,

        totalFinal:
            totalFinal,

        ahorro:
            Math.max(
                0,
                precioNormal -
                totalFinal
            ),

        detallePromos:
            mejorDetalle

    };

}

function escaparAttrV11(valor){
    return String(valor || "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


function imagenProductoV11(producto){

    return (
        producto.imagen ||
        producto.foto ||
        producto.urlImagen ||
        producto.image ||
        producto.imagenUrl ||
        ""
    );
}

function mostrarPaginacion(){

    const cont =
        document.getElementById(
            "paginacion"
        );


    const paginas =
        Math.ceil(
            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA
        );


    if(
        paginas <= 1
    ){

        cont.innerHTML =
            "";

        return;
    }


    let html =
        "";


    for(
        let i = 1;
        i <= paginas;
        i++
    ){

        html += `

            <button
            class="pagina-btn ${
                i === paginaActual
                ? "activa"
                : ""
            }"
            onclick="
            cambiarPagina(
                ${i}
            )">

                ${i}

            </button>

        `;
    }


    cont.innerHTML =
        html;
}


function cambiarPagina(
    pagina
){

    if(
        pagina < 1 ||
        pagina >
        Math.ceil(
            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA
        )
    ){

        return;
    }


    paginaActual =
        pagina;

    mostrarPagina();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =========================================================
   AGREGAR PRODUCTO
   ========================================================= */

function agregarProducto(
    perfume
){

    const producto =
        perfumes.find(
            p =>
                p.perfume ===
                perfume
        );


    if(!producto){
        return;
    }


    /*
    Los productos sin stock
    no se agregan.
    */

    if(
        obtenerEstado(
            producto
        ) ===
        "SIN STOCK"
    ){

        alert(
            "Este perfume está sin stock."
        );

        return;
    }


    const existente =
        carrito.find(
            item =>
                item.producto.perfume ===
                perfume
        );


    if(existente){

        existente.cantidad++;

    }

    else{

        carrito.push({

            producto:
                producto,

            cantidad:1

        });

    }


    actualizarCarrito();

}


/* =========================================================
   ACTUALIZAR CARRITO
   ========================================================= */

function actualizarCarrito(){

    const total =
        totalUnidades();

    const barra =
        document.getElementById(
            "carritoBarra"
        );

    const info =
        document.getElementById(
            "carritoInfo"
        );

    const totalBarra =
        document.getElementById(
            "carritoTotalBarra"
        );


    /*
    =========================================================
    BARRA FLOTANTE
    =========================================================
    */

    info.textContent =
        `${total} ${
            total === 1
            ? "producto"
            : "productos"
        }`;


    let totalPedidoBarra = 0;


    /*
    PARTICULAR
    */

    if(
        modoActual ===
        "particular"
    ){

        if(
            carrito.length
        ){

            const calculo =
                calcularCarritoParticular();

            totalPedidoBarra =
                calculo.totalFinal;

        }

    }


    /*
    MAYORISTA
    */

    else{

        if(
            carrito.length
        ){

            const cantidadEscala =
                Math.max(
                    total,
                    MINIMO_MAYORISTA
                );

            carrito.forEach(
                item => {

                    totalPedidoBarra +=
                        precioMayorista(
                            item.producto,
                            cantidadEscala
                        ) *
                        item.cantidad;

                }
            );

        }

    }


    totalBarra.textContent =
        `TOTAL ${dinero(
            totalPedidoBarra
        )}`;


    /*
    =========================================================
    MISMA INFORMACIÓN DENTRO DE "VER PEDIDO"
    =========================================================
    */

    const infoModal =
        document.getElementById(
            "carritoInfoModal"
        );

    const totalModal =
        document.getElementById(
            "carritoTotalModal"
        );

    if(infoModal){

        infoModal.textContent =
            `${total} ${
                total === 1
                ? "producto"
                : "productos"
            }`;

    }

    if(totalModal){

        totalModal.textContent =
            `TOTAL ${dinero(
                totalPedidoBarra
            )}`;

    }


    /*
    La barra aparece solamente cuando
    hay al menos un producto agregado.
    */

    if(
        total > 0
    ){

        barra.classList.add(
            "visible"
        );

    }

    else{

        barra.classList.remove(
            "visible"
        );

    }


    /*
    Si mayorista y no llega
    al mínimo, avisamos.
    */

    if(
        modoActual ===
        "mayorista" &&
        total > 0 &&
        total <
        MINIMO_MAYORISTA
    ){

        info.textContent =
            `${total} productos · mínimo mayorista ${MINIMO_MAYORISTA}`;

    }


    /*
    Actualiza inmediatamente las tarjetas,
    precios, escalas y contadores.
    */

    if(
        productosFiltrados &&
        productosFiltrados.length
    ){

        mostrarPagina();

    }


    /*
    Si "VER PEDIDO" está abierto, lo actualizamos
    en el mismo momento que se actualiza la barra.
    */

    const modal =
        document.getElementById(
            "modalCarrito"
        );

    if(
        modal &&
        modal.classList.contains("activo") &&
        carrito.length
    ){

        renderizarCarrito();

    }

}



/* =========================================================
   ABRIR CARRITO — PORTAL DIRECTO A BODY
   ========================================================= */

function abrirCarrito(){

    if(
        !carrito.length
    ){

        alert(
            "Todavía no agregaste productos al pedido."
        );

        return;
    }

    const modal =
        document.getElementById(
            "modalCarrito"
        );

    if(!modal){
        return;
    }

    /*
    IMPORTANTE:
    Igual que hicimos con la barra inferior, sacamos
    completamente el recuadro del contenedor del catálogo.

    Así ningún transform, overflow, grid, section o wrapper
    del catálogo puede modificar el comportamiento de
    position: fixed.
    */
    if(
        modal.parentElement !== document.body
    ){

        document.body.appendChild(
            modal
        );

    }

    renderizarCarrito();

    modal.classList.add(
        "activo"
    );

}


/* =========================================================
   CERRAR CARRITO
   ========================================================= */

function cerrarCarrito(){

    const modal =
        document.getElementById(
            "modalCarrito"
        );

    if(!modal){
        return;
    }

    modal.classList.remove(
        "activo"
    );

}


/* =========================================================
   RENDER CARRITO
   ========================================================= */

function renderizarCarrito(){

    const cont =
        document.getElementById(
            "listaCarrito"
        );

    const calculoParticular =
        modoActual === "particular"
        ? calcularCarritoParticular()
        : null;

    const totalPedido =
        totalUnidades();


    /*
    Para mostrar exactamente qué promoción
    está utilizando cada pedido.
    */

    let inspiraciones = 0;

    carrito.forEach(
        item => {

            if(
                tipoPrincipalProducto(
                    item.producto
                ) ===
                "INSPIRACIONES 60ML"
            ){

                inspiraciones +=
                    item.cantidad;

            }

        }
    );


    let promo3Usadas =
        Math.floor(
            inspiraciones / 3
        );

    let restoPromo =
        inspiraciones %
        3;

    let promo2Usadas =
        Math.floor(
            restoPromo / 2
        );

    let unidadesNormales =
        restoPromo % 2;


    /*
    Si 2x + 2x es mejor que 3x,
    el algoritmo general puede usar la
    combinación más conveniente.
    */

    if(
        inspiraciones >= 4 &&
        promo3Usadas > 0
    ){

        const alternativa =
            Math.floor(
                inspiraciones / 2
            );

        if(
            alternativa * 35000 <
            promo3Usadas * 50000 +
            promo2Usadas * 35000 +
            unidadesNormales * 20000
        ){

            promo3Usadas = 0;
            promo2Usadas = alternativa;
            unidadesNormales =
                inspiraciones -
                alternativa * 2;

        }

    }


    const detallePromoHTML =
        modoActual === "particular" &&
        inspiraciones >= 2
        ?
        `
        <div class="promo-detalle">

            <div class="promo-detalle-titulo">
                ${
                    (promo3Usadas > 0 && promo2Usadas > 0)
                    ? "🎉 PROMOCIONES APLICADAS"
                    : "🎉 PROMOCIÓN APLICADA"
                }
            </div>

            ${
                promo3Usadas > 0
                ?
                `
                <div class="promo-detalle-linea">
                    <span class="promo-usada">
                        🔥🔥🔥 ${promo3Usadas > 1 ? promo3Usadas + " × " : ""}3x$50.000
                    </span>
                    <strong>
                        ${dinero(
                            promo3Usadas * 50000
                        )}
                    </strong>
                </div>
                `
                :
                ""
            }

            ${
                promo2Usadas > 0
                ?
                `
                <div class="promo-detalle-linea">
                    <span class="promo-usada">
                        🔥🔥 ${promo2Usadas > 1 ? promo2Usadas + " × " : ""}2x$35.000
                    </span>
                    <strong>
                        ${dinero(
                            promo2Usadas * 35000
                        )}
                    </strong>
                </div>
                `
                :
                ""
            }

            ${
                unidadesNormales > 0
                ?
                `
                <div class="promo-detalle-linea">
                    <span>
                        ${unidadesNormales} unidad sin promoción
                    </span>
                    <strong>
                        ${
                            calculoParticular
                            ?
                            dinero(
                                calculoParticular.precioNormal /
                                Math.max(
                                    totalPedido,
                                    1
                                ) *
                                unidadesNormales
                            )
                            :
                            ""
                        }
                    </strong>
                </div>
                `
                :
                ""
            }

            ${
                calculoParticular &&
                calculoParticular.ahorro > 0
                ?
                `
                <div class="promo-detalle-linea promo-ahorro">
                    <span>
                        💰 AHORRO
                    </span>
                    <strong>
                        -${dinero(
                            calculoParticular.ahorro
                        )}
                    </strong>
                </div>
                `
                :
                ""
            }

        </div>
        `
        :
        "";


    cont.innerHTML =
        carrito
        .map(
            item => {

                const producto =
                    item.producto;

                const precio =
                    modoActual ===
                    "mayorista"

                    ?

                    precioMayorista(
                        producto,
                        Math.max(
                            totalUnidades(),
                            MINIMO_MAYORISTA
                        )
                    )

                    :

                    (tipoPrincipalProducto(producto) === "ORIGINALES"
                        ? precioOriginal(producto).final
                        : precioParticularProducto(producto));

                const subtotal =
                    precio *
                    item.cantidad;

                return `

                    <div class="pedido-item-nuevo">

                        <div class="pedido-item-info">

                            <div class="pedido-item-nombre">
                                ${escapeHTML(
                                    producto.perfume
                                )}
                            </div>

                            <div class="pedido-item-cantidad">
                                Cantidad: ${item.cantidad}
                            </div>

                            <div class="pedido-item-subtotal">
                                Subtotal: ${dinero(subtotal)}
                            </div>

                        </div>

                        <div class="pedido-item-controles">

                            <button
                            class="cantidad-btn"
                            onclick="
                            modificarCantidad(
                                '${escapeJS(
                                    producto.perfume
                                )}',
                                -1
                            )">
                                −
                            </button>

                            <strong>
                                ${item.cantidad}
                            </strong>

                            <button
                            class="cantidad-btn"
                            onclick="
                            modificarCantidad(
                                '${escapeJS(
                                    producto.perfume
                                )}',
                                1
                            )">
                                +
                            </button>

                        </div>

                    </div>

                `;

            }
        )
        .join("");



    /*
    Agregamos el detalle de promociones
    antes del selector de pago.
    */

    const selector =
        document.getElementById(
            "selectorPago"
        );

    if(
        selector &&
        !selector.previousElementSibling?.classList.contains(
            "promo-detalle"
        )
    ){

        selector.insertAdjacentHTML(
            "beforebegin",
            detallePromoHTML
        );

    }
    else if(
        selector &&
        selector.previousElementSibling?.classList.contains(
            "promo-detalle"
        )
    ){

        selector.previousElementSibling.outerHTML =
            detallePromoHTML;

    }


    actualizarResumenCarrito();

}



/* =========================================================
   MODIFICAR CANTIDAD
   ========================================================= */

function modificarCantidad(
    perfume,
    cambio
){

    const item =
        carrito.find(
            x =>
                x.producto.perfume ===
                perfume
        );


    if(!item){
        return;
    }


    item.cantidad +=
        cambio;


    if(
        item.cantidad <= 0
    ){

        carrito =
            carrito.filter(
                x =>
                    x.producto.perfume !==
                    perfume
            );

    }


    actualizarCarrito();


    if(
        carrito.length
    ){

        renderizarCarrito();

    }

    else{

        cerrarCarrito();

    }
}

/* =========================================================
   RESUMEN CARRITO
   ========================================================= */

function actualizarResumenCarrito(){

    const cont =
        document.getElementById(
            "resumenCarrito"
        );


    if(
        !carrito.length
    ){

        cont.innerHTML =
            "";

        return;
    }


    if(
        modoActual ===
        "mayorista"
    ){

        const total =
            totalUnidades();


        if(
            total <
            MINIMO_MAYORISTA
        ){

            cont.innerHTML = `

                <div
                class="resumen-linea">

                    <span>
                        Unidades
                    </span>

                    <strong>
                        ${total}
                    </strong>

                </div>


                <div
                style="
                margin-top:10px;
                color:#b00000;
                font-size:12px;
                ">

                    El pedido mayorista
                    requiere mínimo
                    ${MINIMO_MAYORISTA}
                    unidades.

                </div>

            `;

            return;
        }


        let totalFinal =
            0;


        carrito.forEach(
            item => {

                totalFinal +=
                    precioMayorista(
                        item.producto,
                        total
                    ) *
                    item.cantidad;

            }
        );


        cont.innerHTML = `

            <div
            class="resumen-linea">

                <span>
                    Unidades
                </span>

                <strong>
                    ${total}
                </strong>

            </div>


            <div
            class="resumen-linea">

                <span>
                    Escala
                </span>

                <strong>
                    ${escapeHTML(
                        escalaMayorista(
                            total
                        )
                    )}
                </strong>

            </div>


            <div
            class="resumen-linea resumen-total">

                <span>
                    TOTAL
                </span>

                <strong>
                    ${dinero(
                        totalFinal
                    )}
                </strong>

            </div>

        `;

        return;
    }


    const calculo =
        calcularCarritoParticular();


    cont.innerHTML = `

        <div
        class="resumen-linea">

            <span>
                Subtotal
            </span>

            <strong>
                ${dinero(
                    calculo.precioNormal
                )}
            </strong>

        </div>


        ${
            calculo.ahorro > 0
            ?
            `
            <div
            class="resumen-linea">

                <span>
                    Ahorro
                </span>

                <strong>
                    -${dinero(
                        calculo.ahorro
                    )}
                </strong>

            </div>
            `
            :
            ""
        }


        <div
        class="resumen-linea">

            <span>
                FORMA DE PAGO
            </span>

            <strong>
                ${formaPagoActual === "TARJETA_2_CUOTAS"
                    ? "TARJETA — 2 CUOTAS"
                    : formaPagoActual}
            </strong>

        </div>


        <div
        class="resumen-linea resumen-total">

            <span>
                TOTAL
            </span>

            <strong>
                ${dinero(
                    calculo.totalFinal
                )}
            </strong>

        </div>

    `;
}


/* =========================================================
   ENVIAR WHATSAPP
   ========================================================= */

function enviarWhatsApp(){

    if(
        !carrito.length
    ){

        alert(
            "No hay productos en el pedido."
        );

        return;
    }


    if(
        modoActual ===
        "mayorista" &&
        totalUnidades() <
        MINIMO_MAYORISTA
    ){

        alert(
            `El pedido mayorista requiere mínimo ${MINIMO_MAYORISTA} unidades.`
        );

        return;
    }


    let mensaje =
        "Hola AKKINO Privé!%0A%0A";


    mensaje +=
        modoActual ===
        "mayorista"

        ?

        "Quiero realizar un pedido MAYORISTA:%0A%0A"

        :

        "Quiero realizar un pedido PARTICULAR:%0A%0A";


    carrito.forEach(
        item => {

            const producto =
                item.producto;


            let precioUnitario;


            if(
                modoActual ===
                "mayorista"
            ){

                precioUnitario =
                    precioMayorista(
                        producto,
                        Math.max(
                            totalUnidades(),
                            MINIMO_MAYORISTA
                        )
                    );

            }

            else{

                const original =
                    tipoPrincipalProducto(
                        producto
                    ) ===
                    "ORIGINALES";


                if(original){

                    const precios =
                        precioOriginal(
                            producto
                        );

                    precioUnitario =
                        precioOriginalSegunPago(producto);

                }

                else{

                    precioUnitario =
                        precioParticularProducto(
                            producto
                        );
                }
            }


            mensaje +=
                `${item.cantidad} x ${encodeURIComponent(
                    producto.perfume
                )} - ${encodeURIComponent(
                    dinero(
                        precioUnitario
                    )
                )}%0A`;

        }
    );


    mensaje +=
        "%0A";


    if(
        modoActual ===
        "particular"
    ){

        const calculo =
            calcularCarritoParticular();


        mensaje +=
            `TOTAL: ${encodeURIComponent(
                dinero(
                    calculo.totalFinal
                )
            )}%0A`;

    }

    else{

        let totalFinal =
            0;


        const unidades =
            totalUnidades();


        carrito.forEach(
            item => {

                totalFinal +=
                    precioMayorista(
                        item.producto,
                        unidades
                    ) *
                    item.cantidad;

            }
        );


        mensaje +=
            `TOTAL MAYORISTA: ${encodeURIComponent(
                dinero(
                    totalFinal
                )
            )}%0A`;

    }


    if(
        modoActual ===
        "particular"
    ){

        mensaje +=
            `FORMA DE PAGO: ${encodeURIComponent(
                formaPagoActual
            )}%0A`;

    }


    mensaje +=
        "%0AGracias!";


    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        mensaje;


    window.open(
        url,
        "_blank"
    );
}

    .classList.remove("oculto");

    document

    );

<script id="akkino-mover-barra-al-body">
(function(){

    function moverBarraAlBody(){

        const barra =
            document.getElementById("carritoBarra");

        if(!barra) return;

        if(barra.parentElement !== document.body){

            document.body.appendChild(barra);

        }

    }

    if(document.readyState === "loading"){

        document.addEventListener(
            "DOMContentLoaded",
            moverBarraAlBody
        );

    }else{

        moverBarraAlBody();

    }

    /*
    Por si el catálogo vuelve a renderizar el contenedor
    o reconstruye el DOM.
    */
    const observer =
        new MutationObserver(
            moverBarraAlBody
        );

    observer.observe(
        document.documentElement,
        {
            childList:true,
            subtree:true
        }
    );

})();
</script>
